<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description }}">

  <!-- Favicon -->
<link rel="icon" href="{{ '/images/Smile_icon_smooth.ico' | relative_url }}" type="image/x-icon">
<link rel="shortcut icon" href="{{ '/images/Smile_icon_smooth.ico' | relative_url }}" type="image/x-icon">


  <!-- Font: Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Icons: Font Awesome (v6.5.2) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Your styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="layout">
    <aside class="sidebar">
      <!-- Main navigation -->
      <nav class="nav">
        {% assign current_path = page.url | remove: '.html' %}
        {% for item in site.nav %}
          <a class="nav-link{% if current_path == item.url %} active{% endif %}"
             href="{{ item.url | relative_url }}">
            {{ item.title }}
          </a>
        {% endfor %}
      </nav>

      <!-- Social buttons -->
      <div class="social">
        <a class="social-link linkedin" href="https://www.linkedin.com/in/klest-dedja/"
           target="_blank" rel="noopener">
          <i class="fa-brands fa-linkedin"></i> LinkedIn
        </a>
        <a class="social-link scholar" href="https://scholar.google.com/citations?user=SWJ2Y2cAAAAJ"
           target="_blank" rel="noopener">
          <i class="fa-solid fa-graduation-cap"></i> Google Scholar
        </a>
        <a class="social-link github" href="https://github.com/klestdedja"
           target="_blank" rel="noopener">
          <i class="fa-brands fa-github"></i> GitHub
        </a>
      </div>
    </aside>

    <main class="content" id="main-content">
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <small>© {{ "now" | date: "%Y" }} Klest Dedja</small>
    </div>
  </footer>
</body>
</html>
